[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # raised inside pandas with recent NumPy; nothing to fix on our side
    "ignore:The 'generic' unit for NumPy timedelta:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP",  # style, errors, import order, modern syntax
    "B", "SIM", "C4", "PIE", "RET", "PERF", "RUF",  # likely bugs and needless complexity
    "ARG",  # unused arguments
]
ignore = [
    "RUF001",  # dashes and arrows in user-facing strings are intentional
]

[tool.ruff.lint.per-file-ignores]
# test doubles keep the signature of what they replace, used or not
"tests/*" = ["ARG"]
